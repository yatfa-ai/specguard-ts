# CI for the SpecGuard TypeScript client: typecheck, build, suite — and the suite reports itself
# through the very reporter this repository ships, from its own freshly built dist/. A client that
# does not run behind its own telemetry cannot notice when its reporter breaks: the suite would
# stay green while every consumer's run silently stopped being delivered.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # The matrix is not decoration. The engines floor is a CONSUMER statement (>=20 — a consumer
    # only ever runs the compiled dist/, which has no such constraint, the same split specguard-mcp
    # documents), while this matrix is the DEVELOPMENT floor: every line the project is developed
    # on gets the full suite, because the runner-specific behaviours this client lives on (reporter
    # composition, destination pairing, argument parsing) have all moved between minor lines.
    strategy:
      fail-fast: false        # a break on one line should not hide the others
      matrix:
        node: ['22', '24', '25']

    env:
      SPECGUARD_ENDPOINT: https://specguard.yatfa.com
      # Repository-scoped ingest key for yatfa-ai/specguard-ts. Absent on fork pull requests —
      # the telemetry step below is conditional on it.
      SPECGUARD_API_KEY: ${{ secrets.SPECGUARD_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite reports through ./dist/node-test/reporter.js, which nothing else in this
      # workflow builds (pretest compiles only the tests to .test-build), so the explicit build
      # step is load-bearing for the telemetry below.
      - name: Build
        run: npm run build

      # The reporter is additive and never fails the run. With no key (a fork pull request) the
      # flags are absent and the suite runs on Node's default reporter alone. Composing reporters
      # requires a --test-reporter-destination per --test-reporter whenever more than one is given
      # (enforced from Node 23; the pairing itself is valid on every supported version).
      - name: Enable SpecGuard telemetry when a key is configured
        if: env.SPECGUARD_API_KEY != ''
        run: |
          {
            echo "SPECGUARD_REPORTER_ARGS=--test-reporter=spec --test-reporter-destination=stdout --test-reporter=./dist/node-test/reporter.js --test-reporter-destination=stdout"
            echo "SPECGUARD_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "SPECGUARD_BRANCH=${{ github.head_ref || github.ref_name }}"
            # The node suffix keeps the matrix legs as distinct runs on the platform rather than
            # three deliveries folding into one run (specguard-mcp's workflow does the same).
            echo "SPECGUARD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}"
          } >> "$GITHUB_ENV"

      # Direct node invocation with the reporter flags BEFORE the target, and the target as a
      # shell-expanded file list rather than a quoted directory: this is the one invocation that
      # runs unchanged from Node 20 (the engines floor) through 25. A quoted directory argument is
      # resolved as a module from Node 24.19 and dies with MODULE_NOT_FOUND; a quoted glob needs
      # Node 22+; and on Node 20 anything after the first positional is taken as another test file,
      # so flags appended via `npm test --` would die as "Could not find '--test-reporter=spec'".
      # The shell expands the unquoted glob into that file list, and flags-first keeps every flag
      # a flag on every line of the matrix.
      - name: Run the suite
        run: |
          npm run pretest
          node --test $SPECGUARD_REPORTER_ARGS .test-build/test/*.js
